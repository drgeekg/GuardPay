version: '3.8'

services:
  guardpay:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_demo}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-demo_secret}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    restart: unless-stopped
